  <script>
if ('serviceWorker' in navigator && location.pathname === '/') {
 window.addEventListener('load', async () => {
  try {
   await navigator.serviceWorker.register('/sw.js');
   const registration = await navigator.serviceWorker.ready;
   const urls = performance.getEntriesByType('resource').map(entry => entry.name);
   registration.active?.postMessage({type:'CACHE_PUBLIC_ASSETS', urls});
  } catch (error) { console.warn('Acesso offline indisponível nesta visita.', error); }
 });
}
document.addEventListener('submit', event => {
 if(location.pathname === '/' && !navigator.onLine){event.preventDefault();event.stopImmediatePropagation();alert('Você está offline. Conecte-se à internet para enviar sua mensagem.');}
}, true);
</script>
